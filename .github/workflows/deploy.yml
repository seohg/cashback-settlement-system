name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Build and test
        run: ./gradlew build

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cashback-settlement-system
            docker tag cashback-settlement-system-app:latest cashback-settlement-system-app:previous || true
            git pull
            docker build -t cashback-settlement-system-app .
            docker compose -f docker-compose.yml up -d
            sleep 10
            if curl -sf http://localhost:8080/swagger-ui/index.html > /dev/null; then
              echo "배포 성공"
            else
              echo "헬스체크 실패 — 롤백 진행"
              docker tag cashback-settlement-system-app:previous cashback-settlement-system-app:latest
              docker compose -f docker-compose.yml up -d
              exit 1
            fi
